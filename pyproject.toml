[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lulwa-virtual-printer"
version = "0.2.0"
description = "Experimental local IPP printer endpoints and JPG print capture"
requires-python = ">=3.10"
dependencies = ["Pillow>=10,<13", "PyMuPDF>=1.24,<2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
lulwa-print = "lulwa_virtual_printer.cli:main"
lulwa-ipp = "lulwa_virtual_printer.ipp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
