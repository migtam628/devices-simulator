[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lulwa-virtual-printer"
version = "0.9.0"
description = "Cross-platform Devices Simulator Hub with JPG print capture and experimental IPP service"
requires-python = ">=3.10"
dependencies = ["Pillow>=10,<13", "PyMuPDF>=1.24,<2", "python-barcode>=0.16,<1"]

[project.optional-dependencies]
test = ["pytest>=8"]
desktop = ["pywebview>=5"]

[project.scripts]
lulwa-print = "lulwa_virtual_printer.cli:main"
lulwa-ipp = "lulwa_virtual_printer.ipp_server:main"
lulwa-hub = "lulwa_virtual_printer.hub:main"
lulwa-desktop = "lulwa_virtual_printer.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lulwa_virtual_printer = ["ui/*.html", "ui/*.js", "ppd/*.ppd"]
