[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lulwa-virtual-printer"
version = "0.1.0"
description = "Local virtual print receiver for Brother and Zebra simulated printers"
requires-python = ">=3.10"
dependencies = ["Pillow>=10,<13", "PyMuPDF>=1.24,<2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
lulwa-print = "lulwa_virtual_printer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
