<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devices Simulator — Device Hub</title>
<style>
:root{--nav:#112136;--bg:#f5f7fa;--surface:#fff;--line:#dfe7ef;--ink:#1c2a3e;--mute:#718196;--blue:#2869b2;--pale:#eaf3ff;--teal:#138b81;--purple:#7958a6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #73b5eb;outline-offset:2px}
.shell{display:flex;min-height:100vh}.side{width:240px;flex:none;background:var(--nav);color:#bed0e3;min-height:100vh;position:sticky;top:0;display:flex;flex-direction:column;padding:24px 13px}.brand{color:#fff;font-size:16px;font-weight:800;display:flex;gap:13px;align-items:center;padding:4px 12px 28px}.brand small{color:#86a6c4;font-size:11px;font-weight:400;display:block;margin-top:4px}.logo{border-radius:11px;background:linear-gradient(120deg,#499ae6,#2a62b0);height:40px;width:40px;display:grid;place-items:center;font-size:23px}.navtitle{font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:#7e99b5;font-weight:850;padding:12px}.nav{width:100%;border:0;background:transparent;text-align:left;color:#b5c9de;border-radius:9px;padding:12px 13px;display:flex;align-items:center;gap:12px;font-size:12.5px;font-weight:600}.nav.active,.nav:hover{background:#27486c;color:#fff}.nav.active{box-shadow:inset 3px 0 #6eafea}.nav i{font-style:normal;font-size:18px;width:22px;text-align:center}.sidefoot{margin-top:auto;border-top:1px solid #2a435c;padding:19px 12px;font-size:11px;color:#9cb8d1;line-height:1.7}.sidefoot b{color:#62ccaa}
.main{min-width:0;flex:1}.top{height:67px;display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-bottom:1px solid var(--line);padding:0 35px;gap:10px}.top small{color:var(--mute);font-weight:550}.top strong{color:var(--ink)}.body{max-width:1440px;margin:auto;padding:30px 35px 55px}.heading{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}.heading .eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:1.6px;font-weight:800;color:var(--teal);margin-bottom:8px}.heading h1{font-size:26px;letter-spacing:-.8px;margin:0 0 7px}.heading p,.muted{color:var(--mute);font-size:12px;line-height:1.6}.heading p{margin:0}
.btn{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:10px 15px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.ghost{border:0;background:transparent;color:var(--blue)}.btn.danger{color:#b33d4c}.btn:disabled{opacity:.4;cursor:not-allowed}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grid{display:grid;gap:17px}.four{grid-template-columns:repeat(4,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1.65fr 1fr}.stack{display:flex;flex-direction:column;gap:18px}.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:0 8px 25px #243a5409;min-width:0}.card h2{margin:0 0 6px;font-size:14px}.card h3{margin:0 0 6px;font-size:12px}.cardhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px}.small{font-size:11px;color:var(--mute)}.metric small{color:var(--mute);font-weight:700}.metric strong{display:block;font-size:29px;margin:10px 0 6px;letter-spacing:-1px}.pill{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:750;padding:6px 8px;border-radius:7px;background:#e8f1fd;color:#2869b2}.pill.green{background:#e1f5eb;color:#227d5c}.pill.amber{background:#fff1dc;color:#926117}.pill.gray{background:#ebeff4;color:#65738a}
.tile,.choice{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:18px;text-align:left}.tile{display:flex;flex-direction:column;align-items:center;text-align:center;gap:11px;min-height:130px;justify-content:center}.tile b,.choice b{font-size:12px}.tile small,.choice small{font-size:11px;color:var(--mute);line-height:1.6}.tile:hover,.choice:hover,.choice.active{border-color:#4288d5;background:#f5faff}.tile .ic,.choice .ic{background:#e7f2ff;color:#2869b2;border-radius:11px;width:48px;height:48px;display:grid;place-items:center;font-size:24px}.choice{min-height:127px}.choice b,.choice small{display:block;margin-top:8px}.item{display:flex;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.item .ic{background:#e6f1fd;color:var(--blue);height:42px;width:42px;flex:none;border-radius:10px;display:grid;place-items:center;font-size:22px}.item .grow{flex:1;min-width:0}.item .grow b{display:block;font-size:12px;margin-bottom:5px}.item .grow small{color:var(--mute);font-size:10.5px}.empty{background:#fbfcff;border:1px dashed #c8d4e0;padding:34px;text-align:center;border-radius:11px}.empty b{display:block;margin-bottom:8px}.empty p{max-width:400px;margin:0 auto 16px;font-size:12px;color:var(--mute);line-height:1.7}
.wizard{display:grid;grid-template-columns:195px 1fr;gap:20px}.wstep{display:flex;gap:11px;align-items:center;padding:13px;border-radius:8px;font-size:11px;color:var(--mute)}.wstep.active{background:#e6f1ff;color:var(--ink);font-weight:750}.circle{flex:none;background:#e4eaf1;border-radius:50%;height:25px;width:25px;display:grid;place-items:center;font-weight:800}.active .circle{background:var(--blue);color:white}.wizardpanel{min-height:510px;display:flex;flex-direction:column}.wizardcontent{flex:1}.progress{height:6px;background:#e8edf5;border-radius:8px;margin:12px 0 24px;overflow:hidden}.progress div{height:100%;background:var(--blue)}.sectitle{font-size:19px;letter-spacing:-.4px;margin:0 0 7px}.wfooter{border-top:1px solid var(--line);padding-top:18px;margin-top:26px;display:flex;justify-content:space-between;gap:10px}.field{display:block;margin:20px 0}.field span{font-size:11.5px;font-weight:750;display:block;margin-bottom:8px}.field input,.field select{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:10px 12px;min-height:42px;width:100%}.notice{background:#eaf3ff;border:1px solid #c8dff7;color:#275b8c;border-radius:9px;padding:14px 16px;font-size:12px;line-height:1.7}.notice.warn{background:#fff6e8;border-color:#eddbb6;color:#8f611e}.notice b{display:block;margin-bottom:4px}.mt{margin-top:18px}
.table{border-collapse:collapse;width:100%;text-align:left}.table th{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--mute);background:#f1f5f9}.table td,.table th{padding:13px 12px;border-bottom:1px solid var(--line)}.table td{font-size:12px}.scroll{overflow:auto}
.tray{border:1px solid var(--line);border-radius:10px;padding:18px}.tray .art{background:linear-gradient(155deg,#dde4ed,#9fb3c6);border-radius:8px;border-bottom:9px solid #778fa6;height:110px;display:grid;place-items:center;color:#49627d;font-size:42px;margin:15px 0}.labelart{width:210px;min-height:315px;margin:10px auto;background:#fff;color:#152539;border:1px solid #cad4df;box-shadow:0 12px 25px #0002;padding:20px 15px;display:flex;flex-direction:column;gap:15px;font-size:12px}.labelart .barcode{margin-top:auto;height:56px;background:repeating-linear-gradient(90deg,#122235 0 3px,white 3px 5px,#122235 5px 6px,white 6px 11px)}
.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.shot{border:1px solid var(--line);background:var(--surface);border-radius:10px;overflow:hidden}.shot-img{height:195px;background:#eaf0f6;padding:14px;display:grid;place-items:center}.shot-img img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 4px 13px #15243933}.shot-detail{padding:13px}.shot-detail b{display:block;font-size:11px;margin-bottom:5px}.diag{background:#15263b;border-radius:13px;padding:23px;color:#f0f5fa}.diagcards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}.diagcard{background:#1e354d;border:1px solid #34516a;border-radius:10px;padding:21px}.diagcard strong{font-size:22px;color:#69d4b3;display:block;margin:10px 0}.diagcard small{color:#b4c6d6}.diagrow{display:flex;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid #34516a;font-size:12px}.diagrow span{color:#a8c2da}.studio{background:#faf9ff;border:1px solid var(--line);border-radius:12px;height:490px;position:relative;overflow:hidden;background-image:radial-gradient(#cec2de 1px,transparent 1px);background-size:19px 19px}.node{position:absolute;min-width:165px;background:#fff;border:1px solid #b7a3d5;border-radius:10px;padding:17px;box-shadow:0 8px 20px #2a1c4519;font-size:11px}.node b{display:block;color:#7958a6;margin-bottom:11px}.toast{position:fixed;right:25px;bottom:25px;padding:15px 19px;background:#203d58;color:#fff;border-radius:10px;box-shadow:0 10px 30px #0004;display:none;z-index:5}.toast.show{display:block}.toast.bad{background:#933744}
body.dark{--bg:#101820;--surface:#172333;--line:#35475d;--ink:#eef3f9;--mute:#b0bece;--blue:#78b7f4;--pale:#233954}body.dark .tile:hover,body.dark .choice.active{background:#243b55}body.dark .table th{background:#25364a}body.dark .empty{background:#1b2738}body.dark .notice{background:#213b55;border-color:#365b7b;color:#c2dff7}body.dark .notice.warn{background:#45371f;border-color:#76572b;color:#efce94}
@media(max-width:1200px){.side{width:202px}.four,.gallery{grid-template-columns:repeat(2,1fr)}.three{grid-template-columns:repeat(2,1fr)}.body{padding:24px}.split{grid-template-columns:1fr}}@media(max-width:760px){.side{width:65px;padding:15px 6px}.side .brand{padding:3px 6px 19px}.brand .title,.side .navtitle,.nav .txt,.sidefoot{display:none}.nav{justify-content:center}.top{padding:0 15px}.body{padding:20px 13px}.wizard{grid-template-columns:1fr}.wizardsteps{display:flex;gap:5px;overflow:auto}.wstep{padding:9px}.wstep .stepname{display:none}.gallery{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.four,.three,.two,.gallery,.diagcards{grid-template-columns:1fr}.heading{align-items:flex-start;flex-direction:column}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="shell"><aside class="side"><div class="brand"><div class="logo">▣</div><div class="title">Devices Simulator<small>Device Hub Pro</small></div></div><div class="navtitle">Workspace</div><div id="sidebar"></div><div class="sidefoot">● <b>Local hub ready</b><br>OS integration experimental<br>v0.3 development preview</div></aside>
<div class="main"><header class="top"><div><small>Workspace / </small><strong id="breadcrumb">Home</strong></div><div class="row"><span class="pill" id="systemstatus">● Local service</span><button class="btn" id="theme" aria-label="Toggle theme">◐ Theme</button></div></header><main id="page" class="body" aria-live="polite"></main></div></div><div class="toast" id="toast" role="status"></div>
<script>
const TOKEN="__HUB_TOKEN__",E=id=>document.getElementById(id);
const icons={home:"⌂",devices:"▤",wizard:"⊕",jobs:"▧",gallery:"▥",diagnostics:"◉",integration:"⌘",studio:"◇",settings:"⚙",brother:"▣",zebra:"▤",scanner:"▱",barcode:"▥",receipt:"▦",serial:"⌁"};
const nav=[["home","Home"],["devices","My Devices"],["wizard","Create Device"],["jobs","Jobs & Queue"],["gallery","Output Gallery"],["diagnostics","Diagnostics"],["integration","System Integration"],["studio","Advanced Studio"],["settings","Settings"]];
let state={devices:[],jobs:[],presets:{},platform:"Unknown",output_dir:""},route="home",active="",draft={step:0,preset:"brother",name:"Brother Office Printer",tray:"tray-1",saved:""};
const clean=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const preset=id=>state.presets[id]||{};
const badge=(s,t="")=>'<span class="pill '+t+'">'+clean(s)+'</span>';
const button=(name,action,style="",disabled=false)=>'<button class="btn '+style+'" data-action="'+action+'" '+(disabled?"disabled":"")+'>'+name+'</button>';
function heading(k,t,desc,action=""){return '<div class="heading"><div><div class="eyebrow">'+clean(k)+'</div><h1>'+clean(t)+'</h1><p>'+clean(desc)+'</p></div><div class="row">'+action+'</div></div>'}
function showToast(msg,bad=false){const t=E("toast");t.textContent=msg;t.className="toast show"+(bad?" bad":"");setTimeout(()=>t.className="toast",3500)}
async function post(path,obj){const res=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json","X-Devices-Token":TOKEN},body:JSON.stringify(obj)});const json=await res.json();if(!res.ok)throw Error(json.error||"Request failed");return json}
async function refresh(){const res=await fetch("/api/state",{cache:"no-store"});if(!res.ok)throw Error("Hub is offline");state=await res.json();draw()}
function goto(name,id=""){route=name;if(id)active=id;draw()}
function begin(id="brother"){draft={step:0,preset:id,name:preset(id).name||"New Device",tray:"tray-1",saved:""};goto("wizard")}
function leftnav(){E("sidebar").innerHTML=nav.map(([id,n])=>'<button class="nav '+((route==="detail"?"devices":route)===id?"active":"")+'" data-nav="'+id+'"><i>'+icons[id]+'</i><span class="txt">'+n+'</span></button>').join("")}
function deviceRow(d){const p=preset(d.preset);return '<div class="item"><div class="ic">'+icons[d.preset]+'</div><div class="grow"><b>'+clean(d.name)+'</b><small>'+clean(p.label)+' · '+clean(d.media)+'</small></div>'+badge("OS unverified","amber")+button("Manage","detail:"+d.id)+'</div>'}
function empty(text,desc){return '<div class="empty"><b>'+text+'</b><p>'+desc+'</p>'+button("Create Device","wizard","primary")+'</div>'}
function home(){return heading("DEVICE CONTROL HUB","Welcome to Devices Simulator","Create, configure and test simulated devices without physical hardware.",button("+ Create Device","wizard","primary"))+
'<div class="stack"><div class="grid four">'+[['Configured devices',state.devices.length,'Saved profiles'],['Captured jobs',state.jobs.filter(x=>x.status==="rendered").length,'Local JPG captures'],['OS printers verified',0,'Not checked'],['Local service','Online','Loopback only']].map(([a,b,c])=>'<div class="card metric"><small>'+a+'</small><strong>'+b+'</strong><div class="small">'+c+'</div></div>').join("")+'</div>'+
'<div class="card"><div class="cardhead"><div><h2>Quick create</h2><div class="small">Choose the type of hardware to simulate</div></div>'+badge("OS support experimental","amber")+'</div><div class="grid three">'+Object.entries(state.presets).map(([id,p])=>'<button class="tile" data-preset="'+id+'"><div class="ic">'+icons[id]+'</div><b>'+clean(p.label)+'</b><small>'+clean(p.capability==="planned"?"Preview only":p.media)+'</small></button>').join("")+'</div></div>'+
'<div class="grid split"><div class="card"><div class="cardhead"><h2>Your Devices</h2>'+button("View all","devices","ghost")+'</div>'+(state.devices.length?state.devices.slice(0,5).map(deviceRow).join(""):empty("No devices yet","Create a Brother, Zebra, or preview-only device profile."))+'</div>'+
'<div class="card"><h2>Readiness checklist</h2>'+[['Local JPG capture',"green"],['Device profiles',"green"],['IPP printer registration',"amber"],['Native scanner support',"amber"],['PrintNode verification',"amber"]].map(([name,type],i)=>'<div class="item">'+badge(i<2?"Implemented":"Not verified",type)+'<span class="small">'+name+'</span></div>').join("")+'</div></div></div>'}
function devices(){return heading("DEVICE LIBRARY","My Devices","Browse profiles, perform local sample captures, and view OS integration status.",button("+ New Device","wizard","primary"))+'<div class="card"><div class="cardhead"><h2>Device inventory</h2>'+badge(state.devices.length+" saved profiles")+'</div>'+(state.devices.length?state.devices.map(deviceRow).join(""):empty("Your library is empty","Create a device profile to begin."))+'</div>'}
const steps=["Device Type","Device Profile","Configuration","Behavior","Install in OS","Test & Finish"];
function wizard(){
const s=draft.step,p=preset(draft.preset);let body="";
if(s===0||s===1){body='<h2 class="sectitle">'+(s===0?"Choose your device type":"Select a profile")+'</h2><p class="muted">Choose a compatible profile. Unsupported categories may still be saved as drafts.</p><div class="grid three mt">'+Object.entries(state.presets).filter(([id,v])=>s===0||v.category===p.category).map(([id,v])=>'<button class="choice '+(draft.preset===id?"active":"")+'" data-preset="'+id+'"><div class="ic">'+icons[id]+'</div><b>'+clean(v.label)+'</b><small>'+clean(v.media)+' · '+(v.capability==="planned"?"Planned":"Experimental OS integration")+'</small></button>').join("")+'</div>'}
if(s===2)body='<h2 class="sectitle">Configure '+clean(p.label)+'</h2><p class="muted">Choose a display name and default media source.</p><label class="field"><span>Device name</span><input id="device-name" maxlength="64" value="'+clean(draft.name)+'"></label><div class="grid two"><div class="card"><h3>Media</h3><div class="small">'+clean(p.media)+'</div></div><div class="card"><h3>Resolution</h3><div class="small">'+clean(p.dpi||"Not applicable")+' DPI</div></div></div>'+(draft.preset==="brother"?'<label class="field"><span>Default tray</span><select id="tray"><option value="tray-1" '+(draft.tray==="tray-1"?"selected":"")+'>Tray 1 · Packing slips</option><option value="tray-2" '+(draft.tray==="tray-2"?"selected":"")+'>Tray 2 · Invoices</option></select></label>':"");
if(s===3)body='<h2 class="sectitle">Simulation behavior</h2><p class="muted">Understand exactly what is functional in this version.</p><div class="grid two mt"><div class="card"><h3>JPG output</h3><p class="small">Each test produces an original document, metadata and JPG pages.</p>'+badge("Available","green")+'</div><div class="card"><h3>Simulated paper faults</h3><p class="small">Offline, jams, retries and delays are planned for the next milestone.</p>'+badge("Planned","amber")+'</div></div><div class="notice mt">Output folder: '+clean(state.output_dir)+'</div>';
if(s===4)body='<h2 class="sectitle">System installation readiness</h2><p class="muted">Native system installation is a separate, privileged operation.</p><div class="notice warn mt"><b>Not enabled in the hub yet</b>Existing IPP scripts are experimental. Saving a profile does not install it in Windows, macOS or Linux.</div><div class="card mt"><div class="item">Host operating system: '+clean(state.platform)+'</div><div class="item">OS queue enumeration: '+badge("Not verified","amber")+'</div><div class="item">Native scanner installation: '+badge("Not implemented","amber")+'</div><div class="small mt">Manual experimental steps: docs/OS_PRINTERS.md</div></div>';
if(s===5)body='<h2 class="sectitle">Review and finish</h2><p class="muted">Save the profile and optionally run an API-only sample capture.</p><div class="card mt"><div class="item"><div class="ic">'+icons[draft.preset]+'</div><div class="grow"><b>'+clean(draft.name)+'</b><small>'+clean(p.label)+' · '+clean(p.media)+'</small></div>'+badge("Draft")+'</div><div class="item">OS installed: '+badge("No","amber")+'</div><div class="item">Sample capture: '+badge(draft.saved?"Ready to test":"Not run","amber")+'</div></div>'+(draft.saved?'<div class="row mt">'+button("Run sample test","test:"+draft.saved,"primary")+button("View device","detail:"+draft.saved)+'</div>':'<div class="notice mt">Save the profile to enable the test.</div>');
return heading("CREATE DEVICE","New virtual device","Six-step guided setup · no OS changes without explicit native installation.")+
'<div class="wizard"><div class="wizardsteps">'+steps.map((n,i)=>'<div class="wstep '+(i===s?"active":"")+'"><span class="circle">'+(i+1)+'</span><span class="stepname">'+n+'</span></div>').join("")+'</div>'+
'<div class="card wizardpanel"><div class="wizardcontent"><div class="row between">'+badge("Step "+(s+1)+" of 6")+badge(p.capability==="planned"?"Preview only":"IPP experimental","amber")+'</div><div class="progress"><div style="width:'+((s+1)/6*100)+'%"></div></div>'+body+'</div>'+
'<div class="wfooter">'+button("← Back","back","",s===0)+'<div class="row">'+(s>0?button("Save Draft","save"):"")+(s===5?button(draft.saved?"Finish →":"Save Device","save","primary"):button("Continue →","next","primary"))+'</div></div></div></div>'}
function jobs(){const html=state.jobs.length?'<div class="scroll"><table class="table"><thead><tr><th>Document</th><th>Profile</th><th>Pages</th><th>Origin</th><th>Status</th></tr></thead><tbody>'+state.jobs.map(j=>'<tr><td><b>'+clean(j.title)+'</b><div class="small">'+clean(j.created_at?.slice(0,19))+'</div></td><td>'+clean(j.profile)+'</td><td>'+clean(j.images?.length||0)+'</td><td>Local API</td><td>'+badge(j.status==="rendered"?"Captured":j.status,j.status==="rendered"?"green":"amber")+'</td></tr>').join("")+'</tbody></table></div>':empty("No capture jobs yet","Create a virtual printer and run an API sample.");
return heading("JOBS & QUEUE","Capture History","Actual saved jobs from the local engine, not physical printer output.",button("Output Gallery","gallery"))+'<div class="card">'+html+'</div>'}
function gallery(){const rows=state.jobs.flatMap(j=>(j.images||[]).map(img=>({j,img})));return heading("OUTPUT GALLERY","Captured JPG Files","Open the actual saved pages from simulated printing.",button("Jobs","jobs"))+(rows.length?'<div class="gallery">'+rows.map(({j,img})=>'<div class="shot"><div class="shot-img"><img alt="Print job image" loading="lazy" src="/api/artifacts/'+encodeURIComponent(j.id)+'/'+encodeURIComponent(img)+'"></div><div class="shot-detail"><b>'+clean(j.title)+'</b><p class="small">'+clean(j.profile)+'</p>'+badge("JPG","green")+' <a target="_blank" rel="noopener" href="/api/artifacts/'+encodeURIComponent(j.id)+'/'+encodeURIComponent(img)+'">Open ↗</a></div></div>').join("")+'</div>':empty("No saved JPGs yet","Run a sample print from a device profile to generate output."))}
function detail(){const d=state.devices.find(x=>x.id===active);if(!d)return devices();const p=preset(d.preset),b=d.preset==="brother",z=d.preset==="zebra";return heading("DEVICE MANAGEMENT",d.name,p.label+" · "+p.media,button("Run API test","test:"+d.id,"primary",!b&&!z)+button("Delete profile","remove:"+d.id,"danger"))+
'<div class="grid split"><div class="stack"><div class="card"><div class="cardhead"><h2>'+(b?"Brother Dual-Tray Configuration":z?"Zebra 4×6 Thermal Configuration":"Device Profile Preview")+'</h2>'+badge(p.capability==="planned"?"Planned backend":"Experimental OS integration","amber")+'</div>'+
(b?'<div class="grid two">'+[1,2].map(i=>'<div class="tray"><b>Tray '+i+'</b><div class="art">▤</div><div class="small">Letter · '+(i===1?"Packing slips":"Invoices")+'</div>'+badge(d.tray==="tray-"+i?"Current default":"Profile available",d.tray==="tray-"+i?"green":"")+'</div>').join("")+'</div>':z?'<div class="labelart"><b>LULWA SWIM</b>SHIPPING LABEL<br><small>Illustrative preview</small><div class="barcode"></div>4 × 6 in · 203 DPI</div>':'<div class="notice warn">This category is a configuration preview only. No native OS driver is installed.</div>')+'</div>'+
'<div class="card"><h2>Capture a document</h2><p class="muted">Create a test PDF or import an existing PDF/JPG/PNG. JPG output is local.</p><div class="row wrap mt">'+button("Generate Sample","test:"+d.id,"primary",!b&&!z)+(b||z?'<label class="btn" style="cursor:pointer">Import Document<input style="display:none" type="file" id="file" data-device="'+clean(d.id)+'" accept=".pdf,.jpg,.jpeg,.png"></label>':"")+'</div></div></div>'+
'<div class="stack"><div class="card"><h2>Installation status</h2><div class="item">Device profile '+badge("Draft")+'</div><div class="item">OS registration '+badge("Not verified","amber")+'</div><div class="item">PrintNode '+badge("Not tested","amber")+'</div>'+button("System Integration","integration")+'</div><div class="card"><h2>Settings</h2><div class="item">Media: '+clean(d.media)+'</div><div class="item">DPI: '+clean(d.dpi||"N/A")+'</div><div class="item">Tray: '+clean(b?d.tray:"N/A")+'</div><div class="item">Last API test: '+clean(d.last_test?.status||"Not run")+'</div></div></div></div>'}
function diagnostics(){return heading("COMMAND CENTER","Diagnostics","Monitoring the real local service, without pretending OS installation was verified.",button("Refresh","refresh"))+
'<div class="diag"><h2 style="margin:0">Local systems health</h2><div class="diagcards">'+[['Capture engine','Available','PDF/image → JPG'],['OS print queues','Unverified','Native printer list not queried'],['Profiles',state.devices.length,'Persistent local JSON']].map(([a,b,c])=>'<div class="diagcard"><small>'+a+'</small><strong>'+b+'</strong><small>'+c+'</small></div>').join("")+'</div><div class="grid two"><div class="diagcard"><h3>Capability checks</h3>'+[['Hub API','Running'],['JPG capture','Available'],['IPP queues','Experimental'],['ZPL renderer','Not implemented'],['Scanner/HID','Planned']].map(([a,b])=>'<div class="diagrow"><span>'+a+'</span><b>'+b+'</b></div>').join("")+'</div><div class="diagcard"><h3>Recent captures</h3>'+(state.jobs.length?state.jobs.slice(0,5).map(j=>'<div class="diagrow"><span>'+clean(j.title)+'</span><b>'+clean(j.status)+'</b></div>').join(""):'<p class="small">No captured jobs yet.</p>')+'</div></div></div>'}
function integration(){return heading("SYSTEM INTEGRATION","OS Printer & Scanner Setup","Platform compatibility and native registration requirements.")+
'<div class="notice warn"><b>Not yet controlled from the wizard</b>The existing experimental IPP/CUPS scripts are separate from the desktop hub. A completed capture test is not proof the OS has installed a printer.</div><div class="grid three mt">'+[['Local hub','Running','Loopback HTTP API'],['IPP service','Experimental','Run lulwa-ipp separately'],['OS printer list','Unverified','Windows / macOS / Linux']].map(([a,b,c])=>'<div class="card"><h2>'+a+'</h2>'+badge(b,b==="Running"?"green":"amber")+'<p class="muted mt">'+c+'</p></div>').join("")+'</div><div class="card mt"><h2>Milestones before native-ready</h2>'+['OS queue enumeration and registration','Brother media source and tray roundtrip','Zebra 4 × 6 printable dimensions and ZPL','Scanner eSCL / WIA support (separate device transport)','PrintNode integration with actual OS queues'].map(x=>'<div class="item"><span class="pill amber">Pending</span>'+x+'</div>').join("")+'</div>'}
function studio(){return heading("ADVANCED WORKSPACE","Studio · Shipping Station","Optional visual workflow design inspired by Concept 2.",badge("Preview only","amber"))+
'<div class="notice warn"><b>Illustrative canvas</b>Connecting or editing workflows is not implemented yet. Studio makes no OS changes.</div><div class="studio mt"><div class="node" style="top:14%;left:7%"><b>▧ Document Input</b>New order PDF</div><div class="node" style="top:12%;left:42%"><b>▣ Brother Office</b>Packing slip · Tray 1</div><div class="node" style="top:48%;left:42%"><b>▤ Zebra Thermal</b>Shipping label · 4×6</div><div class="node" style="top:76%;left:69%"><b>▧ Output JPG</b>Capture folder</div></div>'}
function settings(){return heading("HUB PREFERENCES","Settings","Local output, appearance, and privacy options.")+'<div class="grid two"><div class="card"><h2>Appearance</h2><p class="muted">Change theme without changing system preferences.</p><div class="row mt">'+button("Light","light")+button("Dark","dark")+'</div></div><div class="card"><h2>Output folder</h2><p class="small">'+clean(state.output_dir)+'</p><p class="muted">Set a different root using lulwa-hub --output PATH.</p></div><div class="card"><h2>Privacy</h2><p class="muted">Captures stay local. Customer addresses and labels may contain sensitive information.</p></div><div class="card"><h2>Scope</h2><p class="muted">Native installer, background service and scanner OS support remain planned.</p></div></div>'}
function draw(){E("sidebar").innerHTML=nav.map(([k,n])=>'<button class="nav '+((route==="detail"?"devices":route)===k?"active":"")+'" data-nav="'+k+'"><i>'+icons[k]+'</i><span class="txt">'+n+'</span></button>').join("");E("breadcrumb").textContent=route==="detail"?"Device Detail":nav.find(([k])=>k===route)?.[1]||"Home";const pages={home,devices,wizard,jobs,gallery,detail,diagnostics,integration,studio,settings};E("page").innerHTML=(pages[route]||home)()}
async function test(id,file){try{showToast("Rendering sample locally…");let payload={};if(file){if(file.size>25*1024*1024)throw Error("File must be under 25 MB");if(!/\.(pdf|png|jpe?g)$/i.test(file.name))throw Error("Use PDF, PNG, or JPG");const bytes=new Uint8Array(await file.arrayBuffer());let b="";for(let i=0;i<bytes.length;i+=8192)b+=String.fromCharCode(...bytes.subarray(i,i+8192));payload={file_base64:btoa(b),title:file.name.slice(0,80)}}const result=await post("/api/devices/"+id+"/test",payload);await refresh();showToast("Saved "+result.job.images.length+" JPG page(s) · API-only");goto("gallery")}catch(e){showToast(e.message,true)}}
async function save(){try{draft.name=(E("device-name")?.value??draft.name).trim();draft.tray=E("tray")?.value||draft.tray;if(!draft.name)throw Error("Device name is required");if(draft.saved){goto("detail",draft.saved);return}const result=await post("/api/devices",{preset:draft.preset,name:draft.name,tray:draft.tray});draft.saved=result.device.id;await refresh();showToast("Profile saved · no OS queue installed");if(draft.step<5){draft.step=5;draw()}else goto("detail",draft.saved)}catch(e){showToast(e.message,true)}}
document.addEventListener("click",async event=>{
const n=event.target.closest("[data-nav]");if(n){n.dataset.nav==="wizard"?begin():goto(n.dataset.nav);return}
const p=event.target.closest("[data-preset]");if(p){const id=p.dataset.preset;draft.preset=id;draft.name=preset(id).name;draft.saved="";if(route!=="wizard")begin(id);else draw();return}
const a=event.target.closest("[data-action]");if(!a)return;const k=a.dataset.action;
if(k==="wizard")return begin();if(nav.some(([id])=>id===k))return goto(k);
if(k==="next"){if(draft.step===2){draft.name=E("device-name")?.value.trim()||"";draft.tray=E("tray")?.value||draft.tray;if(!draft.name){showToast("Device name required",true);return}}draft.step=Math.min(5,draft.step+1);return draw()}
if(k==="back"){draft.step=Math.max(0,draft.step-1);return draw()}
if(k==="save")return save();if(k==="refresh")return refresh().then(()=>showToast("Hub refreshed"));
if(k.startsWith("detail:"))return goto("detail",k.slice(7));if(k.startsWith("test:"))return test(k.slice(5));
if(k.startsWith("remove:")){const id=k.slice(7);if(!confirm("Remove this profile? Captured JPGs and OS queues are not deleted."))return;try{await post("/api/devices/"+id,{action:"remove_profile"});await refresh();goto("devices");showToast("Profile removed")}catch(e){showToast(e.message,true)}return}
if(k==="light"||k==="dark"){document.body.classList.toggle("dark",k==="dark");localStorage.setItem("devicehub-theme",k);return}
});
document.addEventListener("input",e=>{if(e.target.id==="device-name")draft.name=e.target.value});
document.addEventListener("change",e=>{if(e.target.id==="tray")draft.tray=e.target.value;if(e.target.id==="file"&&e.target.files?.[0])test(e.target.dataset.device,e.target.files[0])});
E("theme").addEventListener("click",()=>{document.body.classList.toggle("dark");localStorage.setItem("devicehub-theme",document.body.classList.contains("dark")?"dark":"light")});
if(localStorage.getItem("devicehub-theme")==="dark")document.body.classList.add("dark");
refresh().catch(e=>E("page").innerHTML='<div class="notice warn">Unable to connect: '+clean(e.message)+'</div>');
</script></body></html>
