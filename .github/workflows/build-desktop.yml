name: Build desktop executables

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'packaging/**'
      - 'pyproject.toml'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            label: Windows x64
            artifact: DevicesSimulator-Windows-x64
            desktop: true
          - runner: macos-15
            label: macOS Apple Silicon
            artifact: DevicesSimulator-macOS-arm64
            desktop: true
          - runner: macos-15-intel
            label: macOS Intel
            artifact: DevicesSimulator-macOS-x64
            desktop: true
          - runner: ubuntu-22.04
            label: Linux x64
            artifact: DevicesSimulator-Linux-x64
            desktop: false

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install desktop and packaging requirements
        if: matrix.desktop
        run: python -m pip install -e '.[desktop,test]' 'pyinstaller>=6.12,<7'

      - name: Install Linux and packaging requirements
        if: ${{ !matrix.desktop }}
        run: python -m pip install -e '.[test]' 'pyinstaller>=6.12,<7'

      - name: Run unit and integration tests
        run: python -m pytest -q

      - name: Build OS-native executable
        run: python packaging/build.py

      - name: Smoke test frozen executable
        run: python packaging/smoke.py

      - name: Upload executable archive and checksum
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  publish_release:
    name: Publish cross-platform binaries to GitHub Releases
    needs: package
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: DevicesSimulator-*
          path: release-assets
          merge-multiple: true
      - name: Verify binaries and checksums
        shell: bash
        run: |
          set -euo pipefail
          for stem in DevicesSimulator-Windows-x64 DevicesSimulator-macOS-x64 DevicesSimulator-macOS-arm64; do
            test -s "release-assets/${stem}.zip"
            (cd release-assets && sha256sum -c "${stem}.zip.sha256")
          done
          test -s release-assets/DevicesSimulator-Linux-x64.tar.gz
          (cd release-assets && sha256sum -c DevicesSimulator-Linux-x64.tar.gz.sha256)
      - name: Create versioned GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION=$(grep '^version = ' pyproject.toml | head -1 | cut -d '"' -f 2)
          test -n "$VERSION"
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG exists; bump version before next publish"
            exit 1
          fi
          files=(release-assets/*)
          gh release create "$TAG" "${files[@]}" --target "$RELEASE_SHA" --title "Devices Simulator $TAG (experimental)" --prerelease --notes "Cross-platform portable executables. Experimental printing and barcode keyboard simulation; native scanner drivers are not included."
          echo "Release: https://github.com/${GH_REPO}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
  manifest:
    name: Build summary
    if: always()
    needs: package
    runs-on: ubuntu-22.04
    steps:
      - name: Summarize result
        env:
          MATRIX_RESULT: ${{ needs.package.result }}
        run: |
          echo '## Devices Simulator desktop build' >> "$GITHUB_STEP_SUMMARY"
          echo "Matrix result: **${MATRIX_RESULT}**" >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the platform-specific archives from the Artifacts section.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Windows/macOS packages are unsigned. Linux runs the UI in a default browser.' >> "$GITHUB_STEP_SUMMARY"
