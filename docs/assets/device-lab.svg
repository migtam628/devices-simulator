<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="690" viewBox="0 0 1100 690" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Devices Simulator virtual hardware lab</title>
<desc id="desc">Illustration of a laptop running Devices Simulator beside an office printer, thermal label maker and barcode scanner.</desc>
<defs>
 <linearGradient id="screen" x1="430" y1="97" x2="850" y2="517" gradientUnits="userSpaceOnUse"><stop stop-color="#20334E"/><stop offset="1" stop-color="#070F20"/></linearGradient>
 <linearGradient id="screenInside" x1="410" y1="144" x2="890" y2="510" gradientUnits="userSpaceOnUse"><stop stop-color="#fff"/><stop offset="1" stop-color="#E9F0F8"/></linearGradient>
 <linearGradient id="laptop" x1="421" y1="506" x2="823" y2="595" gradientUnits="userSpaceOnUse"><stop stop-color="#F8FBFF"/><stop offset=".57" stop-color="#98A7B8"/><stop offset="1" stop-color="#404B5B"/></linearGradient>
 <linearGradient id="printer" x1="111" y1="275" x2="369" y2="532" gradientUnits="userSpaceOnUse"><stop stop-color="#FBFEFF"/><stop offset=".45" stop-color="#D6DFEA"/><stop offset="1" stop-color="#8498AD"/></linearGradient>
 <linearGradient id="printerDark" x1="197" y1="327" x2="289" y2="513" gradientUnits="userSpaceOnUse"><stop stop-color="#596F87"/><stop offset="1" stop-color="#1C314B"/></linearGradient>
 <linearGradient id="thermal" x1="650" y1="418" x2="901" y2="591" gradientUnits="userSpaceOnUse"><stop stop-color="#4B5B6B"/><stop offset=".38" stop-color="#151C27"/><stop offset="1" stop-color="#090E18"/></linearGradient>
 <linearGradient id="scan" x1="917" y1="359" x2="1024" y2="628" gradientUnits="userSpaceOnUse"><stop stop-color="#627388"/><stop offset=".52" stop-color="#171E2E"/><stop offset="1" stop-color="#070B14"/></linearGradient>
 <linearGradient id="paper" x1="220" y1="360" x2="295" y2="555" gradientUnits="userSpaceOnUse"><stop stop-color="#FFF"/><stop offset="1" stop-color="#EBF3FC"/></linearGradient>
 <linearGradient id="glow" x1="0" x2="1"><stop stop-color="#2A88F5" stop-opacity=".25"/><stop offset="1" stop-color="#29E6D2" stop-opacity=".06"/></linearGradient>
 <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
 <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="17" stdDeviation="15" flood-color="#000916" flood-opacity=".48"/></filter>
 <filter id="low" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#010712" flood-opacity=".4"/></filter>
</defs>
